<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Launchplane: what is running</title>
<style>
  :root { color-scheme: light dark; --ok: #1a7f37; --bad: #cf222e; --muted: #6e7781; --line: #8c959f66; }
  @media (prefers-color-scheme: dark) { :root { --ok: #3fb950; --bad: #f85149; --muted: #8b949e; } }
  body { font: 16px/1.45 system-ui, sans-serif; margin: 0 auto; max-width: 46rem; padding: 1rem; overflow-wrap: anywhere; }
  h1 { font-size: 1.3rem; margin: 0 0 .25rem; }
  h2 { font-size: 1.1rem; margin: 0 0 .25rem; }
  #reading { color: var(--muted); margin: 0 0 1rem; }
  #reading[role=alert] { color: inherit; border: 2px solid var(--bad); border-radius: .5rem; padding: .75rem; }
  section { border: 1px solid var(--line); border-radius: .5rem; padding: .75rem; margin-bottom: 1rem; }
  ul { list-style: none; padding: 0; margin: .5rem 0 0; }
  li { border-top: 1px solid var(--line); padding: .5rem 0 0; margin-top: .5rem; }
  code { font-size: .9em; overflow-wrap: anywhere; }
  small { display: block; font-size: 1em; color: var(--muted); }
  [data-health=ok] { color: var(--ok); }
  [data-health=bad] { color: var(--bad); }
  [data-row] { display: flex; flex-wrap: wrap; gap: .75rem; align-items: baseline; }
  [data-row] > * { min-width: 0; }
  [data-label] { min-width: 7rem; color: var(--muted); }
  [data-container] { font-size: .8rem; padding-left: 7.75rem; }
  #not-current { font-weight: 600; margin: 0 0 .5rem; }
  main[data-not-current] { opacity: .55; }
  #last-failure { border-left: 3px solid var(--bad); padding-left: .5rem; margin: 0 0 1rem; }
  #last-failure button { margin-left: .5rem; }
  [data-tag] { display: inline-block; font-size: .8rem; border: 1px solid currentColor; border-radius: .25rem; padding: 0 .35rem; }
</style>
</head>
<body>
<h1>What is running</h1>
<p id="reading">Reading the host…</p>
<p id="last-failure" hidden><span id="last-failure-text"></span><button id="dismiss-failure" type="button">Dismiss</button></p>
<p id="not-current" hidden></p>
<main id="lanes"></main>
<script>
"use strict";
/** @typedef {{product: string, lane: ?string, build: ?string, container: string, state: string, networks: string[], data_set: ?string, receives_visitors_for: ?string}} Instance */
/** @typedef {{product: string, lane: ?string, build: ?string, container: string, state: string, networks: string[], running_for_seconds: ?number, instance: ?string}} Job */
/** @typedef {{product: string, lane: ?string, data_set: string, networks: {name: string, is_quiet: boolean}[], volumes: string[], databases: {container: string, state: string, networks: string[]}[]}} DataSet */
/** @typedef {{product: string, lane: string, problems: string[], release_under_way: string[], left_unfinished: string[], a_move_is_at_work: boolean}} Lane */
/** @typedef {{web_address: string, product: ?string, lane: ?string, sends_to_container: ?string, answers: boolean, error: ?string}} WebAddress */
/** @typedef {{read_at: string, instances: Instance[], jobs: Job[], data_sets: DataSet[], networks: {name: string, is_quiet: boolean}[], web_addresses: WebAddress[], lanes: Lane[]}} Running */
const READ_EVERY_MS = 1000;
const GIVE_UP_AFTER_MS = 15000;
const reading = document.getElementById("reading");
const lanes = document.getElementById("lanes");
const notCurrent = document.getElementById("not-current");
const DIGEST = /^sha256:([0-9a-f]{12})[0-9a-f]*$/;
const lastFailureLine = document.getElementById("last-failure");
const lastFailureText = document.getElementById("last-failure-text");
let lastGoodReadAt = null;
/** @type {Set<string>} */
/** @type {?{at: string, text: string}} */
let lastFailure = null;

/**
 * @param {string} tag
 * @param {Object<string, string>} attributes
 * @param {...(Node|string)} children
 */
function element(tag, attributes, ...children) {
  const made = document.createElement(tag);
  for (const [key, value] of Object.entries(attributes)) made.setAttribute(key, value);
  made.append(...children);
  return made;
}

function code(text) {
  return element("code", {}, text);
}

/** @param {string} build */
function shortBuild(build) {
  const at = build.lastIndexOf("@");
  const digest = DIGEST.exec(build.slice(at + 1));
  if (!digest) return build;
  return at < 0 ? digest[1] : `${build.slice(0, at)}@${digest[1]}`;
}

/** @param {?string} build */
function buildCode(build) {
  if (build === null) return code("not marked");
  return element("code", { title: build }, shortBuild(build));
}

function health(isGood) {
  return { "data-health": isGood ? "ok" : "bad" };
}

function clockTime(isoTime) {
  return new Date(isoTime).toLocaleTimeString();
}

/**
 * @param {string} label
 * @param {...(Node|string)} values
 */
function row(label, ...values) {
  return element("div", { "data-row": "" }, element("span", { "data-label": "" }, label), ...values);
}

/** @param {string} state */
function stateTag(state) {
  return element("span", { "data-tag": "" }, state);
}

/**
 * @param {Instance} instance
 * @param {number} index
 * @param {Job[]} jobs
 */
function instanceItem(instance, index, jobs) {
  const heading = row(`Instance ${index + 1}`, stateTag(instance.state));
  if (instance.receives_visitors_for) heading.append(element("span", { "data-tag": "" }, "active"));
  const container = element("small", { "data-container": "" }, instance.container);
  const item = element("li", {}, heading, container, row("Build", buildCode(instance.build)));
  if (instance.data_set) item.append(row("Data set", code(instance.data_set)));
  for (const job of jobs.filter((each) => each.instance === instance.container)) item.append(jobRow("Job", job));
  return item;
}

/**
 * @param {string} label
 * @param {Job} job
 */
function jobRow(label, job) {
  return row(label, stateTag(job.state));
}

/** @param {DataSet} dataSet */
function dataSetRow(dataSet) {
  const servers = dataSet.databases.flatMap((database) => [element("span", {}, "database"), stateTag(database.state)]);
  return row("Data set", code(dataSet.data_set), ...servers);
}

/**
 * @param {string} kind
 * @param {string[]} findings
 * @param {string} heading
 * @param {Object<string, string>} tone
 */
function findingRows(kind, findings, heading, tone) {
  const lines = findings.length && heading ? [heading, ...findings] : findings;
  return lines.map((text) => element("small", { "data-finding": kind, ...tone }, text));
}

/** @param {Lane} verdict */
function verdictRows(verdict) {
  return [
    ...findingRows("wrong", verdict.problems, "", health(false)),
    ...findingRows("release", verdict.release_under_way, "Launchplane is moving this lane now. A release is under way:", {}),
    ...findingRows("unfinished", verdict.left_unfinished, "No move is at work on this lane, and it was left unfinished. Asking for a build again finishes it:", health(false)),
  ];
}

/** @param {Job} job */
function jobWithoutInstanceItem(job) {
  const container = element("small", { "data-container": "" }, job.container);
  return element("li", {}, jobRow("Job with no instance", job), container, row("Build", buildCode(job.build)));
}

/**
 * @param {Instance} first
 * @param {Instance} second
 */
function visitedFirst(first, second) {
  const byVisitors = Number(!first.receives_visitors_for) - Number(!second.receives_visitors_for);
  return byVisitors || first.container.localeCompare(second.container);
}

/**
 * @param {Instance[]} instances
 * @param {Job[]} jobs
 */
function instanceList(instances, jobs) {
  return element("ul", {}, ...instances.toSorted(visitedFirst).map((instance, index) => instanceItem(instance, index, jobs)));
}

/**
 * @param {WebAddress} entry
 * @param {Instance[]} allInstances
 */
function whyNotAnswering(entry, allInstances) {
  const target = allInstances.find((instance) => instance.container === entry.sends_to_container);
  if (target?.state === "running") return `The instance it is sent to is running, and does not answer with success: ${entry.error}`;
  return entry.error;
}

/**
 * @param {WebAddress} entry
 * @param {Instance[]} allInstances
 */
function webAddressRows(entry, allInstances) {
  const status = element("span", health(entry.answers), entry.answers ? "answering" : "not answering");
  const rows = [row("Web address", code(entry.web_address), status)];
  if (!entry.answers) rows.push(element("small", health(false), whyNotAnswering(entry, allInstances)));
  return rows;
}

/**
 * @param {string} container
 * @param {Instance[]} allInstances
 */
function routeElsewhere(container, allInstances) {
  const instance = allInstances.find((each) => each.container === container);
  const where = instance ? `, an instance of ${instance.product} · ${instance.lane ?? "no lane"}.` : ", which is not on the host.";
  return element("small", {}, "The proxy sends it to the container ", code(container), where);
}

/**
 * @param {WebAddress} entry
 * @param {Running} answer
 */
function laneSection(entry, answer) {
  const laneInstances = answer.instances.filter((instance) => isOfLane(instance, entry));
  const laneJobs = answer.jobs.filter((job) => isOfLane(job, entry));
  const title = entry.product ? `${entry.product} · ${entry.lane ?? "no lane"}` : "A web address with no instance on the host";
  const section = element("section", {}, element("h2", {}, title), ...webAddressRows(entry, answer.instances));
  const verdict = answer.lanes.find((lane) => isOfLane(lane, entry));
  if (verdict) section.append(...verdictRows(verdict));
  for (const dataSet of answer.data_sets.filter((each) => isOfLane(each, entry))) section.append(dataSetRow(dataSet));
  if (entry.sends_to_container && !laneInstances.some((instance) => instance.container === entry.sends_to_container)) {
    section.append(routeElsewhere(entry.sends_to_container, answer.instances));
  }
  if (laneInstances.length) section.append(instanceList(laneInstances, laneJobs));
  const jobsWithoutInstance = laneJobs.filter((job) => !laneInstances.some((instance) => instance.container === job.instance));
  if (jobsWithoutInstance.length) section.append(element("ul", {}, ...jobsWithoutInstance.map(jobWithoutInstanceItem)));
  return section;
}

/**
 * @param {{product: string, lane: ?string}} part
 * @param {WebAddress} entry
 */
function isOfLane(part, entry) {
  return entry.product !== null && part.product === entry.product && part.lane === entry.lane;
}

/** @param {Running} answer */
function showRunning(answer) {
  lastGoodReadAt = answer.read_at;
  reading.removeAttribute("role");
  reading.textContent = `Read from the host at ${clockTime(answer.read_at)}.`;
  showLastFailure();
  markReadingCurrent();
  const sections = answer.web_addresses.map((entry) => laneSection(entry, answer));
  const withoutLane = answer.instances.filter((instance) => instance.lane === null);
  if (withoutLane.length) {
    sections.push(element("section", {}, element("h2", {}, "Instances with no lane"), instanceList(withoutLane, answer.jobs)));
  }
  if (!sections.length) sections.push(element("p", {}, "The host answered, and nothing marked for Launchplane is on it."));
  lanes.replaceChildren(...sections);
}

function showLastFailure() {
  lastFailureLine.hidden = lastFailure === null;
  if (lastFailure) lastFailureText.textContent = `A read failed at ${clockTime(lastFailure.at)}: ${lastFailure.text}`;
}

function dismissFailure() {
  lastFailure = null;
  showLastFailure();
}

function showProblem(text) {
  lastFailure = { at: new Date().toISOString(), text };
  lastFailureLine.hidden = true;
  const since = lastGoodReadAt
    ? `It last could at ${clockTime(lastGoodReadAt)}, ${Math.round((Date.now() - Date.parse(lastGoodReadAt)) / 1000)} s ago.`
    : "It has not read the host since this page opened.";
  reading.setAttribute("role", "alert");
  reading.textContent = `${text} ${since}`;
  markReadingOld();
}

function markReadingCurrent() {
  notCurrent.hidden = true;
  lanes.removeAttribute("data-not-current");
}

function markReadingOld() {
  if (lastGoodReadAt === null) return;
  notCurrent.textContent = `Not current: below is what was read at ${clockTime(lastGoodReadAt)}.`;
  notCurrent.hidden = false;
  lanes.setAttribute("data-not-current", "");
}

async function readRunning() {
  const response = await fetch("running", { cache: "no-store", signal: AbortSignal.timeout(GIVE_UP_AFTER_MS) });
  const answer = await response.json();
  if (response.ok) showRunning(answer);
  else showProblem(`Launchplane cannot read the host: ${answer.error ?? JSON.stringify(answer)}`);
}

async function keepReading() {
  try {
    await readRunning();
  } catch (error) {
    showProblem(`This page cannot get an answer from Launchplane: ${error.message}.`);
  }
  setTimeout(keepReading, READ_EVERY_MS);
}

document.getElementById("dismiss-failure").addEventListener("click", dismissFailure);
keepReading();
</script>
</body>
</html>
