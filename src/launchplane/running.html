<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Launchplane: what is running</title>
<style>
  :root { color-scheme: light dark; --ok: #1a7f37; --bad: #cf222e; --way: #0969da; --muted: #6e7781; --line: #8c959f66; }
  @media (prefers-color-scheme: dark) { :root { --ok: #3fb950; --bad: #f85149; --way: #58a6ff; --muted: #8b949e; } }
  body { font: 16px/1.45 system-ui, sans-serif; margin: 0 auto; max-width: 46rem; padding: 1rem; overflow-wrap: anywhere; }
  h1 { font-size: 1.3rem; margin: 0 0 .25rem; }
  h2 { font-size: 1.1rem; margin: 0; }
  #reading { color: var(--muted); margin: 0 0 1rem; }
  #reading[role=alert] { color: inherit; border: 2px solid var(--bad); border-radius: .5rem; padding: .75rem; }
  section { border: 1px solid var(--line); border-radius: .5rem; padding: .75rem; margin-bottom: 1rem; }
  code { font-size: .9em; overflow-wrap: anywhere; }
  small { display: block; font-size: 1em; color: var(--muted); }
  [data-row] { display: flex; flex-wrap: wrap; gap: .25rem .75rem; align-items: baseline; margin-top: .5rem; }
  [data-row] > * { min-width: 0; }
  [data-name] { width: 10rem; color: var(--muted); }
  [data-value] { flex: 1 1 12rem; }
  [data-pills] { display: flex; flex-wrap: wrap; gap: .35rem; margin-left: auto; }
  [data-pill] { font-size: .8rem; border: 1px solid currentColor; border-radius: .25rem; padding: 0 .35rem; white-space: nowrap; }
  [data-tone=good] { color: var(--ok); }
  [data-tone=wrong] { color: var(--bad); }
  [data-tone="on purpose"] { color: var(--way); }
  [data-note] { font-size: .8rem; padding-left: 10.75rem; }
  #not-current { font-weight: 600; margin: 0 0 .5rem; }
  main[data-not-current] { opacity: .55; }
  #last-failure { border-left: 3px solid var(--bad); padding-left: .5rem; margin: 0 0 1rem; }
  #last-failure button { margin-left: .5rem; }
</style>
</head>
<body>
<h1>What is running</h1>
<p id="reading">Reading the host…</p>
<p id="last-failure" hidden><span id="last-failure-text"></span><button id="dismiss-failure" type="button">Dismiss</button></p>
<p id="not-current" hidden></p>
<main id="lanes"></main>
<script>
"use strict";
/** @typedef {"good"|"wrong"|"on purpose"} Tone */
/** @typedef {{product: string, lane: ?string, build: ?string, container: string, state: string, receives_visitors_for: ?string}} Instance */
/** @typedef {{product: string, lane: ?string, build: ?string, container: string, state: string, instance: ?string}} BackgroundService */
/** @typedef {{product: string, lane: ?string, data_set: string, databases: {container: string, state: string, image: ?string}[]}} DataSet */
/** @typedef {{product: string, lane: string, problems: string[], release_under_way: string[], left_unfinished: string[], a_move_is_at_work: boolean, in_maintenance: boolean, in_maintenance_since: ?string, parts: Object<string, Tone>}} Lane */
/** @typedef {{web_address: string, product: ?string, lane: ?string, sends_to_container: ?string, answers: boolean, shows_back_soon_page: boolean, error: ?string}} WebAddress */
/** @typedef {{read_at: string, instances: Instance[], background_services: BackgroundService[], data_sets: DataSet[], web_addresses: WebAddress[], lanes: Lane[]}} Running */
const READ_EVERY_MS = 1000;
const GIVE_UP_AFTER_MS = 15000;
const reading = document.getElementById("reading");
const lanes = document.getElementById("lanes");
const notCurrent = document.getElementById("not-current");
const DIGEST = /^sha256:([0-9a-f]{12})[0-9a-f]*$/;
const lastFailureLine = document.getElementById("last-failure");
const lastFailureText = document.getElementById("last-failure-text");
let lastGoodReadAt = null;
/** @type {?{at: string, text: string}} */
let lastFailure = null;

/**
 * @param {string} tag
 * @param {Object<string, string>} attributes
 * @param {...(Node|string)} children
 */
function element(tag, attributes, ...children) {
  const made = document.createElement(tag);
  for (const [key, value] of Object.entries(attributes)) made.setAttribute(key, value);
  made.append(...children);
  return made;
}

function code(text) {
  return element("code", {}, text);
}

/** @param {string} build */
function shortBuild(build) {
  const at = build.lastIndexOf("@");
  const digest = DIGEST.exec(build.slice(at + 1));
  if (!digest) return build;
  return at < 0 ? digest[1] : `${build.slice(0, at)}@${digest[1]}`;
}

/** @param {?string} build */
function buildCode(build) {
  if (build === null) return code("not marked");
  return element("code", { title: build }, shortBuild(build));
}

function clockTime(isoTime) {
  return new Date(isoTime).toLocaleTimeString();
}

/**
 * @param {string} text
 * @param {Tone} tone
 */
function pill(text, tone) {
  return element("span", { "data-pill": "", "data-tone": tone }, text);
}

/**
 * Every row on the page: a name, then a value, then its status pills at the end.
 * @param {string} name
 * @param {(Node|string)[]} value
 * @param {Node[]} pills
 */
function row(name, value, pills) {
  return element(
    "div",
    { "data-row": "" },
    element("span", { "data-name": "" }, name),
    element("span", { "data-value": "" }, ...value),
    element("span", { "data-pills": "" }, ...pills),
  );
}

/** @param {string} text */
function note(text) {
  return element("small", { "data-note": "" }, text);
}

/**
 * @param {{container: string, state: string}} part
 * @param {?Lane} verdict
 */
function statePill(part, verdict) {
  return pill(part.state, verdict?.parts[part.container] ?? "wrong");
}

/**
 * @param {Instance} instance
 * @param {number} index
 * @param {?Lane} verdict
 */
function instanceRows(instance, index, verdict) {
  const pills = [statePill(instance, verdict)];
  if (instance.receives_visitors_for) pills.push(pill("active", "good"));
  return [row(`Instance ${index + 1}`, ["build ", buildCode(instance.build)], pills), note(instance.container)];
}

/**
 * @param {BackgroundService} running
 * @param {?Lane} verdict
 */
function backgroundServiceRows(running, verdict) {
  return [row("Background service", ["build ", buildCode(running.build)], [statePill(running, verdict)]), note(running.container)];
}

/**
 * @param {DataSet} dataSet
 * @param {?Lane} verdict
 */
function dataSetRows(dataSet, verdict) {
  if (!dataSet.databases.length) return [row("Data set", [code(dataSet.data_set), " has no database server"], [])];
  return dataSet.databases.flatMap((database) => [
    row("Data set", ["image ", buildCode(database.image)], [statePill(database, verdict)]),
    note(database.container),
  ]);
}

/**
 * @param {string[]} findings
 * @param {string} status
 * @param {Tone} tone
 */
function findingRows(findings, status, tone) {
  return findings.map((text) => row("Found", [text], [pill(status, tone)]));
}

/** @param {Lane} verdict */
function verdictRows(verdict) {
  const rows = [
    ...findingRows(verdict.problems, "wrong", "wrong"),
    ...findingRows(verdict.release_under_way, "under way", "on purpose"),
    ...findingRows(verdict.left_unfinished, "left unfinished", "wrong"),
  ];
  if (verdict.left_unfinished.length) rows.push(note("No call is at work on this lane. Asking for a build again finishes it."));
  return rows;
}

/**
 * @param {Instance} first
 * @param {Instance} second
 */
function visitedFirst(first, second) {
  const byVisitors = Number(!first.receives_visitors_for) - Number(!second.receives_visitors_for);
  return byVisitors || first.container.localeCompare(second.container);
}

/**
 * @param {WebAddress} entry
 * @param {Instance[]} allInstances
 */
function whyNotAnswering(entry, allInstances) {
  const target = allInstances.find((instance) => instance.container === entry.sends_to_container);
  if (target?.state === "running") return `The instance it is sent to is running, and does not answer with success: ${entry.error}`;
  return entry.error;
}

/** @param {WebAddress} entry */
function webAddressPill(entry) {
  if (entry.shows_back_soon_page) return pill("shows the back soon page", "on purpose");
  return entry.answers ? pill("answering", "good") : pill("not answering", "wrong");
}

/**
 * @param {WebAddress} entry
 * @param {Instance[]} allInstances
 */
function webAddressRows(entry, allInstances) {
  const rows = [row("Web address", [code(entry.web_address)], [webAddressPill(entry)])];
  if (entry.error) rows.push(note(whyNotAnswering(entry, allInstances)));
  return rows;
}

/**
 * @param {string} title
 * @param {?Lane} verdict
 */
function laneHeading(title, verdict) {
  const pills = [];
  if (verdict?.in_maintenance) pills.push(pill("in maintenance", "on purpose"));
  if (verdict?.a_move_is_at_work) pills.push(pill("Launchplane is at work", "on purpose"));
  const heading = [element("div", { "data-row": "" }, element("h2", { "data-value": "" }, title), element("span", { "data-pills": "" }, ...pills))];
  if (verdict?.in_maintenance_since) heading.push(element("small", {}, `In maintenance since ${new Date(verdict.in_maintenance_since).toLocaleString()}.`));
  return heading;
}

/**
 * @param {WebAddress} entry
 * @param {Running} answer
 */
function laneSection(entry, answer) {
  const verdict = answer.lanes.find((lane) => isOfLane(lane, entry)) ?? null;
  const title = entry.product ? `${entry.product} · ${entry.lane ?? "no lane"}` : "A web address with no instance on the host";
  const laneInstances = answer.instances.filter((instance) => isOfLane(instance, entry));
  return element(
    "section",
    {},
    ...laneHeading(title, verdict),
    ...webAddressRows(entry, answer.instances),
    ...(verdict ? verdictRows(verdict) : []),
    ...answer.background_services.filter((each) => isOfLane(each, entry)).flatMap((each) => backgroundServiceRows(each, verdict)),
    ...laneInstances.toSorted(visitedFirst).flatMap((instance, index) => instanceRows(instance, index, verdict)),
    ...answer.data_sets.filter((each) => isOfLane(each, entry)).flatMap((each) => dataSetRows(each, verdict)),
  );
}

/**
 * @param {{product: string, lane: ?string}} part
 * @param {WebAddress} entry
 */
function isOfLane(part, entry) {
  return entry.product !== null && part.product === entry.product && part.lane === entry.lane;
}

/**
 * @param {string} name
 * @param {{product: string, container: string, state: string}} part
 */
function noLaneRows(name, part) {
  return [row(name, [code(part.container), ` of ${part.product}`], [pill(part.state, "wrong"), pill("no lane label", "wrong")])];
}

/** @param {Running} answer */
function noLaneSections(answer) {
  const rows = [
    ...answer.instances.filter((each) => each.lane === null).flatMap((each) => noLaneRows("Web part", each)),
    ...answer.background_services.filter((each) => each.lane === null).flatMap((each) => noLaneRows("Background service", each)),
    ...answer.data_sets
      .filter((each) => each.lane === null)
      .map((each) => row("Data set", [code(each.data_set), ` of ${each.product}`], [pill("no lane label", "wrong")])),
  ];
  if (!rows.length) return [];
  return [element("section", {}, ...laneHeading("Marked for Launchplane, and in no lane", null), ...rows)];
}

/** @param {Running} answer */
function showRunning(answer) {
  lastGoodReadAt = answer.read_at;
  reading.removeAttribute("role");
  reading.textContent = `Read from the host at ${clockTime(answer.read_at)}.`;
  showLastFailure();
  markReadingCurrent();
  const sections = [...answer.web_addresses.map((entry) => laneSection(entry, answer)), ...noLaneSections(answer)];
  if (!sections.length) sections.push(element("p", {}, "The host answered, and nothing marked for Launchplane is on it."));
  lanes.replaceChildren(...sections);
}

function showLastFailure() {
  lastFailureLine.hidden = lastFailure === null;
  if (lastFailure) lastFailureText.textContent = `A read failed at ${clockTime(lastFailure.at)}: ${lastFailure.text}`;
}

function dismissFailure() {
  lastFailure = null;
  showLastFailure();
}

function showProblem(text) {
  lastFailure = { at: new Date().toISOString(), text };
  lastFailureLine.hidden = true;
  const since = lastGoodReadAt
    ? `It last could at ${clockTime(lastGoodReadAt)}, ${Math.round((Date.now() - Date.parse(lastGoodReadAt)) / 1000)} s ago.`
    : "It has not read the host since this page opened.";
  reading.setAttribute("role", "alert");
  reading.textContent = `${text} ${since}`;
  markReadingOld();
}

function markReadingCurrent() {
  notCurrent.hidden = true;
  lanes.removeAttribute("data-not-current");
}

function markReadingOld() {
  if (lastGoodReadAt === null) return;
  notCurrent.textContent = `Not current: below is what was read at ${clockTime(lastGoodReadAt)}.`;
  notCurrent.hidden = false;
  lanes.setAttribute("data-not-current", "");
}

async function readRunning() {
  const response = await fetch("running", { cache: "no-store", signal: AbortSignal.timeout(GIVE_UP_AFTER_MS) });
  const answer = await response.json();
  if (response.ok) showRunning(answer);
  else showProblem(`Launchplane cannot read the host: ${answer.error ?? JSON.stringify(answer)}`);
}

async function keepReading() {
  try {
    await readRunning();
  } catch (error) {
    showProblem(`This page cannot get an answer from Launchplane: ${error.message}.`);
  }
  setTimeout(keepReading, READ_EVERY_MS);
}

document.getElementById("dismiss-failure").addEventListener("click", dismissFailure);
keepReading();
</script>
</body>
</html>
