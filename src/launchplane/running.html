<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Launchplane: what is running</title>
<style>
  :root { color-scheme: light dark; --ok: #1a7f37; --bad: #cf222e; --way: #0969da; --unread: #9a6700; --muted: #6e7781; --line: #8c959f66; }
  @media (prefers-color-scheme: dark) { :root { --ok: #3fb950; --bad: #f85149; --way: #58a6ff; --unread: #d29922; --muted: #8b949e; } }
  body { font: 16px/1.45 system-ui, sans-serif; margin: 0 auto; max-width: 46rem; padding: 1rem; overflow-wrap: anywhere; }
  h1 { font-size: 1.3rem; margin: 0 0 .25rem; }
  h2 { font-size: 1.1rem; margin: 0; }
  #reading { color: var(--muted); margin: 0 0 1rem; }
  #reading[role=alert] { color: inherit; border: 2px solid var(--bad); border-radius: .5rem; padding: .75rem; }
  section { border: 1px solid var(--line); border-radius: .5rem; padding: .75rem; margin-bottom: 1rem; }
  code { font-size: .9em; overflow-wrap: anywhere; }
  small { display: block; font-size: 1em; color: var(--muted); }
  [data-row] { display: flex; flex-wrap: wrap; gap: .25rem .75rem; align-items: baseline; margin-top: .5rem; }
  [data-row] > * { min-width: 0; }
  [data-name] { width: 10rem; color: var(--muted); }
  [data-value] { flex: 1 1 12rem; }
  [data-pills] { display: flex; flex-wrap: wrap; gap: .35rem; margin-left: auto; }
  [data-pill] { font-size: .8rem; border: 1px solid currentColor; border-radius: .25rem; padding: 0 .35rem; white-space: nowrap; }
  [data-tone=good] { color: var(--ok); }
  [data-tone=wrong] { color: var(--bad); }
  [data-tone="on purpose"] { color: var(--way); }
  [data-tone="could not be read"] { color: var(--unread); }
  [data-note] { font-size: .8rem; padding-left: 10.75rem; }
  #not-current { font-weight: 600; margin: 0 0 .5rem; }
  main[data-not-current] { opacity: .55; }
  #last-failure { border-left: 3px solid var(--bad); padding-left: .5rem; margin: 0 0 1rem; }
  #last-failure button { margin-left: .5rem; }
</style>
</head>
<body>
<h1>What is running</h1>
<p id="reading">Reading the host…</p>
<p id="last-failure" hidden><span id="last-failure-text"></span><button id="dismiss-failure" type="button">Dismiss</button></p>
<p id="not-current" hidden></p>
<main id="lanes"></main>
<script>
"use strict";
/** @typedef {{text: string, tone: string}} Pill */
/** @typedef {{text: string, drawn_as: "text"|"code"|"build"}} Piece */
/** @typedef {{name: string, value: Piece[], pills: Pill[], note: ?string}} Row */
/** @typedef {{title: string, pills: Pill[], in_maintenance_since: ?string, rows: Row[]}} Card */
/** @typedef {{read_at: string, cards: Card[]}} Running */
const READ_EVERY_MS = 1000;
const GIVE_UP_AFTER_MS = 15000;
const reading = document.getElementById("reading");
const lanes = document.getElementById("lanes");
const notCurrent = document.getElementById("not-current");
const DIGEST = /^sha256:([0-9a-f]{12})[0-9a-f]*$/;
const lastFailureLine = document.getElementById("last-failure");
const lastFailureText = document.getElementById("last-failure-text");
let lastGoodReadAt = null;
/** @type {?{at: string, text: string}} */
let lastFailure = null;

/**
 * @param {string} tag
 * @param {Object<string, string>} attributes
 * @param {...(Node|string)} children
 */
function element(tag, attributes, ...children) {
  const made = document.createElement(tag);
  for (const [key, value] of Object.entries(attributes)) made.setAttribute(key, value);
  made.append(...children);
  return made;
}

/** @param {string} build */
function shortBuild(build) {
  const at = build.lastIndexOf("@");
  const digest = DIGEST.exec(build.slice(at + 1));
  if (!digest) return build;
  return at < 0 ? digest[1] : `${build.slice(0, at)}@${digest[1]}`;
}

const DRAWN = {
  text: (text) => text,
  code: (text) => element("code", {}, text),
  build: (text) => element("code", { title: text }, shortBuild(text)),
};

function clockTime(isoTime) {
  return new Date(isoTime).toLocaleTimeString();
}

/** @param {Pill[]} pills */
function pillsOf(pills) {
  return element("span", { "data-pills": "" }, ...pills.map((pill) => element("span", { "data-pill": "", "data-tone": pill.tone }, pill.text)));
}

/**
 * Every row on the page: a name, then a value, then its status pills at the end, and its note under it.
 * @param {Row} row
 */
function rowOf(row) {
  const drawn = element(
    "div",
    { "data-row": "" },
    element("span", { "data-name": "" }, row.name),
    element("span", { "data-value": "" }, ...row.value.map((piece) => DRAWN[piece.drawn_as](piece.text))),
    pillsOf(row.pills),
  );
  return row.note === null ? [drawn] : [drawn, element("small", { "data-note": "" }, row.note)];
}

/** @param {Card} card */
function cardOf(card) {
  const heading = [element("div", { "data-row": "" }, element("h2", { "data-value": "" }, card.title), pillsOf(card.pills))];
  if (card.in_maintenance_since !== null) heading.push(element("small", {}, `In maintenance since ${new Date(card.in_maintenance_since).toLocaleString()}.`));
  return element("section", {}, ...heading, ...card.rows.flatMap(rowOf));
}

/** @param {Running} answer */
function showRunning(answer) {
  lastGoodReadAt = answer.read_at;
  reading.removeAttribute("role");
  reading.textContent = `Read from the host at ${clockTime(answer.read_at)}.`;
  showLastFailure();
  markReadingCurrent();
  lanes.replaceChildren(...answer.cards.map(cardOf));
}

function showLastFailure() {
  lastFailureLine.hidden = lastFailure === null;
  if (lastFailure) lastFailureText.textContent = `A read failed at ${clockTime(lastFailure.at)}: ${lastFailure.text}`;
}

function dismissFailure() {
  lastFailure = null;
  showLastFailure();
}

function showProblem(text) {
  lastFailure = { at: new Date().toISOString(), text };
  lastFailureLine.hidden = true;
  const since = lastGoodReadAt
    ? `It last could at ${clockTime(lastGoodReadAt)}, ${Math.round((Date.now() - Date.parse(lastGoodReadAt)) / 1000)} s ago.`
    : "It has not read the host since this page opened.";
  reading.setAttribute("role", "alert");
  reading.textContent = `${text} ${since}`;
  markReadingOld();
}

function markReadingCurrent() {
  notCurrent.hidden = true;
  lanes.removeAttribute("data-not-current");
}

function markReadingOld() {
  if (lastGoodReadAt === null) return;
  notCurrent.textContent = `Not current: below is what was read at ${clockTime(lastGoodReadAt)}.`;
  notCurrent.hidden = false;
  lanes.setAttribute("data-not-current", "");
}

async function readRunning() {
  const response = await fetch("running", { cache: "no-store", signal: AbortSignal.timeout(GIVE_UP_AFTER_MS) });
  const answer = await response.json();
  if (response.ok) showRunning(answer);
  else showProblem(`Launchplane cannot read the host: ${answer.error ?? JSON.stringify(answer)}`);
}

async function keepReading() {
  try {
    await readRunning();
  } catch (error) {
    showProblem(`This page cannot get an answer from Launchplane: ${error.message}.`);
  }
  setTimeout(keepReading, READ_EVERY_MS);
}

document.getElementById("dismiss-failure").addEventListener("click", dismissFailure);
keepReading();
</script>
</body>
</html>
